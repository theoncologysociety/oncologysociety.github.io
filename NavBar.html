<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/industry-4d4fe465-6e9b-4d0e-852e-a1ccb3403655/styles.css">
<script src="_ds/industry-4d4fe465-6e9b-4d0e-852e-a1ccb3403655/_ds_bundle.js"></script>
</helmet>
<nav class="nav" style="position:sticky;top:0;z-index:100;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:{{ navBg }};border-bottom:1px solid var(--color-divider);padding:var(--space-3) var(--space-6);">
  <a href="index.dc.html" class="nav-brand" style="display:flex;align-items:center;gap:var(--space-2);text-decoration:none;color:inherit;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.5"><rect x="2.5" y="2.5" width="19" height="19"></rect><line x1="12" y1="6.5" x2="12" y2="17.5"></line><line x1="6.5" y1="12" x2="17.5" y2="12"></line></svg>
    <span>Oncology Society</span>
  </a>
  <sc-if value="{{ showLinks }}" hint-placeholder-val="{{ true }}">
    <a href="index.dc.html" aria-current="{{ auraHome }}">Home</a>
    <a href="about.dc.html" aria-current="{{ auraAbout }}">About Us</a>
    <a href="team.dc.html" aria-current="{{ auraTeam }}">Our Team</a>
    <a href="get-involved.dc.html" aria-current="{{ auraGet }}">Get Involved</a>
    <a href="chapters.dc.html" aria-current="{{ auraChapters }}">Chapters</a>
    <a href="events.dc.html" aria-current="{{ auraEvents }}">Events</a>
    <a href="learn.dc.html" aria-current="{{ auraLearn }}">Learn Oncology!</a>
    <a href="get-involved.dc.html" class="btn btn-primary" style="margin-left:var(--space-2);">Join Us</a>
  </sc-if>
  <sc-if value="{{ showBurger }}" hint-placeholder-val="{{ false }}">
    <button type="button" class="btn btn-icon" onClick="{{ toggleMenu }}" aria-label="Open menu" style="margin-left:auto;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </sc-if>
</nav>
<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;inset:0;z-index:99;background:var(--color-bg);display:flex;flex-direction:column;padding:var(--space-6);gap:var(--space-6);">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span class="nav-brand">Oncology Society</span>
      <button type="button" class="btn btn-icon" onClick="{{ toggleMenu }}" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>
    <div style="display:flex;flex-direction:column;gap:var(--space-6);font-family:var(--font-heading);font-size:26px;text-transform:uppercase;letter-spacing:0.02em;">
      <a href="index.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">Home</a>
      <a href="about.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">About Us</a>
      <a href="team.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">Our Team</a>
      <a href="get-involved.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">Get Involved</a>
      <a href="chapters.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">Chapters</a>
      <a href="events.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">Events</a>
      <a href="learn.dc.html" style="color:inherit;text-decoration:none;" onClick="{{ toggleMenu }}">Learn Oncology!</a>
    </div>
    <a href="get-involved.dc.html" class="btn btn-primary btn-block" style="margin-top:auto;" onClick="{{ toggleMenu }}">Join Us</a>
  </div>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:64},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;team&quot;,&quot;get-involved&quot;,&quot;chapters&quot;,&quot;events&quot;,&quot;learn&quot;]}}">
class Component extends DCLogic {
  state = { isMobile: typeof window !== 'undefined' && window.innerWidth < 900, menuOpen: false, scrolled: false };
  componentDidMount() {
    this.onResize = () => this.setState({ isMobile: window.innerWidth < 900 });
    this.onScroll = () => this.setState({ scrolled: window.scrollY > 8 });
    window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('scroll', this.onScroll);
  }
  renderVals() {
    const cur = this.props.current || '';
    const aura = (key) => (cur === key ? 'page' : null);
    return {
      showLinks: !this.state.isMobile,
      showBurger: this.state.isMobile,
      menuOpen: this.state.isMobile && this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      navBg: this.state.scrolled ? 'color-mix(in srgb, var(--color-bg) 90%, transparent)' : 'color-mix(in srgb, var(--color-bg) 78%, transparent)',
      auraHome: aura('home'), auraAbout: aura('about'), auraTeam: aura('team'),
      auraGet: aura('get-involved'), auraChapters: aura('chapters'),
      auraEvents: aura('events'), auraLearn: aura('learn'),
    };
  }
}
</script>
</body>
</html>
